name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install shell checks
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install shellcheck shfmt
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck shfmt
          fi
      - name: Install development tools
        run: uv sync --frozen
      - name: Check
        run: uv run python scripts/check.py
      - name: Test
        run: uv run python scripts/test.py
  cloud-recipes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-packer@v3.4.0
        with:
          version: "1.16.2"
      - uses: anchore/sbom-action/download-syft@v0
        id: syft
      - name: Check guest exclusions with the actual SBOM collector
        env:
          SYFT_BIN: ${{ steps.syft.outputs.cmd }}
        run: python3 scripts/check-sbom.py "$SYFT_BIN"
      - name: Validate both cloud recipes without authentication or resources
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: python3 scripts/check-cloud.py
