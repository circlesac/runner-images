name: Hosted reference inventories
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Capture the native image before setup actions can add their own tools.
      - uses: ./
        with:
          output: inventory.json
      - uses: ./compare
        with:
          reference: inventory.json
          candidate: inventory.json
      - uses: actions/upload-artifact@v7
        with:
          name: reference-${{ matrix.os }}
          path: inventory.json
          if-no-files-found: error
          retention-days: 30
