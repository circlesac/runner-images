name: Release cloud runner images
on:
  push:
    branches: [main]
    paths: [cloud/**, runner_images/cloud.py, runner_images/compare.py, runner_images/inventory.py, scripts/cloud-image.py, .github/workflows/release-cloud.yml, snapshots/github-hosted/ubuntu-24.04.json]
  workflow_dispatch:
  workflow_run:
    workflows: [Hosted reference inventories]
    types: [completed]
  schedule:
    - cron: "0 1 * * *"
permissions:
  contents: read
jobs:
  image:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.conclusion == 'success'))
    strategy:
      fail-fast: false
      matrix:
        provider: [gcp, azure]
    concurrency:
      group: cloud-image-${{ matrix.provider }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PROVIDER: ${{ matrix.provider }}
      GH_TOKEN: ${{ github.token }}
      PACKER_GITHUB_API_TOKEN: ${{ github.token }}
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      GCP_NETWORK: ${{ vars.GCP_NETWORK }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_BUILD_RESOURCE_GROUP: ${{ vars.AZURE_BUILD_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_GALLERY: ${{ vars.AZURE_GALLERY }}
      AZURE_IMAGE_DEFINITION: ${{ vars.AZURE_IMAGE_DEFINITION }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: hashicorp/setup-packer@v3.4.0
        with:
          version: "1.16.2"
      - uses: google-github-actions/auth@v3
        if: matrix.provider == 'gcp'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT }}
      - uses: google-github-actions/setup-gcloud@v3.0.1
        if: matrix.provider == 'gcp'
      - uses: azure/login@v3.1.0
        if: matrix.provider == 'azure'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve upstream base and skip unchanged inputs
        id: plan
        run: python3 scripts/cloud-image.py plan "$PROVIDER"
      - name: Build cloud image and verify provisioning evidence
        id: build
        if: steps.plan.outputs.needed == 'true'
        run: python3 scripts/cloud-image.py build "$PROVIDER"
      - uses: anchore/scan-action@v7.4.2
        if: steps.plan.outputs.needed == 'true'
        with:
          sbom: artifacts/cloud/${{ matrix.provider }}/sbom.spdx.json
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: artifacts/cloud/${{ matrix.provider }}/vulnerabilities.json
      - uses: actions/attest@v4.2.2
        if: steps.plan.outputs.needed == 'true'
        id: provenance
        with:
          subject-name: circlesac/runner-images/cloud/${{ matrix.provider }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://circles.ac/runner-images/cloud-build/v1
          predicate-path: artifacts/cloud/${{ matrix.provider }}/image.json
      - uses: actions/attest-sbom@v4.1.0
        if: steps.plan.outputs.needed == 'true'
        id: sbom
        with:
          subject-name: circlesac/runner-images/cloud/${{ matrix.provider }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: artifacts/cloud/${{ matrix.provider }}/sbom.spdx.json
      - name: Publish verified release
        if: steps.plan.outputs.needed == 'true'
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "artifacts/cloud/$PROVIDER/provenance.sigstore.json"
          cp "$SBOM_BUNDLE" "artifacts/cloud/$PROVIDER/sbom.sigstore.json"
          python3 scripts/cloud-image.py publish "$PROVIDER"
      - name: Record released cloud image in Git
        if: steps.plan.outputs.record == 'true'
        run: bash scripts/commit-cloud.sh
      - name: Remove owned temporary resources and unpublished images
        if: always()
        run: python3 scripts/cloud-image.py cleanup "$PROVIDER"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cloud-${{ matrix.provider }}-diagnostics
          path: artifacts/cloud/${{ matrix.provider }}/
          if-no-files-found: ignore
          retention-days: 30
