name: Build Docker runner image
on:
  pull_request:
    paths: [docker/**, runner_images/**, scripts/inventory.py, .dockerignore, .github/workflows/build-docker.yml]
  push:
    branches: [main]
    paths: [docker/**, runner_images/**, scripts/inventory.py, .dockerignore, .github/workflows/build-docker.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64
      - name: Build and qualify the actual native image
        run: bash docker/build-image.sh runner-candidate:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docker-image-qualification
          path: artifacts/docker/
          retention-days: 7
