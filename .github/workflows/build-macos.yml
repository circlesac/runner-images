name: Build and qualify Tart image
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Public image profile to build and compare
        type: choice
        options: [xcode, xcode-android]
        required: true
permissions:
  contents: read
concurrency:
  group: tart-image-build
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    # A physical Apple Silicon Mac: the ordinary VM fleet cannot nest macOS VMs.
    # This group must allow only this exact workflow at refs/heads/main.
    runs-on:
      group: runner-image-builders
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 360
    outputs:
      bundle: ${{ steps.build.outputs.bundle }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build, verify and compare
        id: build
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          image="macos-26-$PROFILE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          bash macos/build-image.sh "$image" \
            ghcr.io/cirruslabs/macos-tahoe-xcode:latest "$PROFILE"
          echo "bundle=$image" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tart-qualification
          path: artifacts/tart/
          retention-days: 30
          if-no-files-found: warn
          overwrite: true
  record:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Verify dispatched source
        env:
          SOURCE: ${{ github.sha }}
        run: git checkout -B main "$SOURCE"
      - uses: actions/download-artifact@v8
        with:
          name: tart-qualification
          path: ${{ runner.temp }}/qualification
      - name: Record passing image evidence in Git
        env:
          BUNDLE: ${{ needs.build.outputs.bundle }}
          BUNDLES: ${{ runner.temp }}/qualification
        run: |
          bash scripts/commit-qualification.sh \
            "$BUNDLES/$BUNDLE" main
